<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Crest Wealth Investment</title><link rel="stylesheet" href="popup.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

html,
body{
width:100%;
min-height:100%;
}

body{
min-height:100vh;
background:
radial-gradient(circle at 10% 10%,rgba(59,130,246,.25),transparent 30%),
radial-gradient(circle at 90% 90%,rgba(30,64,175,.30),transparent 30%),
linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

/* LOGIN CARD */

.login-box{
width:100%;
max-width:420px;
background:#fff;
border-radius:22px;
padding:30px 28px;
box-shadow:0 20px 60px rgba(0,0,0,.40);
}

/* LOGO */

.logo{
width:78px;
height:78px;
margin:0 auto 14px;
display:flex;
align-items:center;
justify-content:center;
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
}

/* TEXT */

.login-box h2{
text-align:center;
font-size:24px;
font-weight:700;
color:#123c91;
margin-bottom:5px;
}

.login-box > p{
text-align:center;
font-size:13px;
color:#64748b;
margin-bottom:22px;
}

/* INPUT */

.input-group{
position:relative;
margin-bottom:13px;
}

.input-group input{
width:100%;
height:52px;
border:1px solid #dbe3ef;
border-radius:11px;
background:#f8fafc;
outline:none;
font-size:14px;
padding:0 45px;
color:#0f172a;
transition:.25s;
}

.input-group input:focus{
background:#fff;
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.input-icon{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#64748b;
font-size:15px;
}

/* PASSWORD BUTTON */

.password-toggle{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:none;
background:transparent;
color:#64748b;
cursor:pointer;
padding:7px;
font-size:15px;
}

.password-toggle:hover{
color:#2563eb;
}

/* LOGIN BUTTON */

.login-btn{
width:100%;
height:52px;
border:none;
border-radius:11px;
margin-top:5px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
font-size:15px;
font-weight:600;
cursor:pointer;
box-shadow:0 7px 18px rgba(37,99,235,.25);
transition:.25s;
}

.login-btn:hover{
transform:translateY(-1px);
}

.login-btn:disabled{
opacity:.75;
cursor:not-allowed;
}

/* LOADER */

.loader{
width:17px;
height:17px;
border:3px solid rgba(255,255,255,.35);
border-top:3px solid #fff;
border-radius:50%;
display:inline-block;
animation:spin .8s linear infinite;
vertical-align:middle;
margin-right:7px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* FORGOT */

.forgot-password{
text-align:center;
margin-top:16px;
}

.forgot-password a{
color:#2563eb;
font-size:13px;
font-weight:600;
text-decoration:none;
}

.forgot-password a:hover{
text-decoration:underline;
}

/* DIVIDER */

.divider{
display:flex;
align-items:center;
gap:10px;
margin:19px 0;
color:#94a3b8;
font-size:10px;
}

.divider::before,
.divider::after{
content:"";
height:1px;
background:#e2e8f0;
flex:1;
}

/* SIGN UP */

.signup{
text-align:center;
font-size:13px;
color:#64748b;
}

.signup a{
color:#2563eb;
font-weight:600;
text-decoration:none;
margin-left:3px;
}

.signup a:hover{
text-decoration:underline;
}

/* MOBILE */

@media(max-width:480px){

body{
padding:15px;
}

.login-box{
padding:26px 20px;
border-radius:19px;
}

.logo{
width:70px;
height:70px;
}

.login-box h2{
font-size:22px;
}

.login-box > p{
font-size:12px;
margin-bottom:19px;
}

.input-group input{
height:50px;
}

.login-btn{
height:50px;
}

}

</style></head><body><div class="login-box"><div class="logo"><img
src="1234.png"
alt="Crest Wealth Investment">

</div><h2>Welcome Back</h2><p>Login to your Crest Wealth investment account.</p><form id="loginForm"><div class="input-group"><i class="fa-solid fa-envelope input-icon"></i>

<input
type="email"
id="email"
placeholder="Email Address"
autocomplete="email"
required>

</div><div class="input-group"><i class="fa-solid fa-lock input-icon"></i>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password"
required>

<button
type="button"
class="password-toggle"
id="togglePassword"
aria-label="Show password">

<i class="fa-solid fa-eye"></i>

</button></div><button
type="submit"
id="loginBtn"
class="login-btn">

Login

</button><div class="forgot-password"><a href="forgot-password.html">
Forgot Password?
</a></div><div class="divider">
<span>ACCOUNT</span>
</div><div class="signup">Don't have an account?

<a href="register.html">
Create Account
</a></div></form></div><script src="popup.js"></script><script src="login.js"></script><script>

const password =
document.getElementById("password");

const toggle =
document.getElementById("togglePassword");

toggle.addEventListener("click",function(){

const icon = toggle.querySelector("i");

if(password.type === "password"){

password.type = "text";

icon.classList.remove("fa-eye");
icon.classList.add("fa-eye-slash");

}else{

password.type = "password";

icon.classList.remove("fa-eye-slash");
icon.classList.add("fa-eye");

}

});

</script></body>
         </html>
