<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Evergreen Investments</title>

<link rel="stylesheet" href="popup.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

/* =========================================================
   EVERGREEN INVESTMENTS - LOGIN
========================================================= */

:root{
    --green:#0f6b4f;
    --green-dark:#084c3b;
    --green-deep:#063b2f;
    --green-light:#e9f7f1;
    --accent:#1fa774;
    --text:#14221d;
    --muted:#718079;
    --border:#dfe9e4;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(31,167,116,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(8,76,59,.30),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #031c16,
            #063b2f,
            #0f6b4f
        );

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    position:relative;
    overflow-x:hidden;
}


/* =========================================================
   BACKGROUND DECORATION
========================================================= */

body::before{
    content:"";
    position:fixed;

    width:280px;
    height:280px;

    border-radius:50%;

    border:45px solid rgba(255,255,255,.035);

    top:-120px;
    right:-90px;

    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;

    width:220px;
    height:220px;

    border-radius:50%;

    border:35px solid rgba(255,255,255,.035);

    bottom:-100px;
    left:-90px;

    pointer-events:none;
}


/* =========================================================
   LOGIN CARD
========================================================= */

.login-box{

    position:relative;
    z-index:2;

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,.98);

    border-radius:24px;

    padding:34px 30px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);

    border:1px solid rgba(255,255,255,.35);

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    width:82px;
    height:82px;

    margin:0 auto 15px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:#ffffff;

    padding:7px;

    box-shadow:
        0 8px 22px rgba(6,59,47,.12);

}

.logo img{

    width:100%;
    height:100%;

    object-fit:contain;

}


/* =========================================================
   BRAND NAME
========================================================= */

.brand-name{

    text-align:center;

    font-size:21px;

    font-weight:800;

    color:var(--green-dark);

    margin-bottom:4px;

}

.brand-subtitle{

    text-align:center;

    font-size:12px;

    color:var(--muted);

    margin-bottom:24px;

}


/* =========================================================
   WELCOME
========================================================= */

.login-box h2{

    text-align:center;

    font-size:24px;

    font-weight:700;

    color:var(--text);

    margin-bottom:6px;

}

.login-box > p{

    text-align:center;

    font-size:13px;

    color:var(--muted);

    margin-bottom:24px;

}


/* =========================================================
   INPUT GROUP
========================================================= */

.input-group{

    position:relative;

    margin-bottom:14px;

}

.input-group input{

    width:100%;

    height:54px;

    border:1px solid var(--border);

    border-radius:13px;

    background:#f7faf8;

    outline:none;

    font-size:14px;

    padding:0 48px;

    color:var(--text);

    transition:.25s;

}

.input-group input::placeholder{
    color:#9aa7a1;
}

.input-group input:focus{

    background:#ffffff;

    border-color:var(--accent);

    box-shadow:
        0 0 0 3px rgba(31,167,116,.11);

}

.input-icon{

    position:absolute;

    left:16px;

    top:50%;

    transform:translateY(-50%);

    color:var(--green);

    font-size:15px;

    pointer-events:none;

}


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

.password-toggle{

    position:absolute;

    right:10px;

    top:50%;

    transform:translateY(-50%);

    width:34px;

    height:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:none;

    background:transparent;

    color:#718079;

    cursor:pointer;

    border-radius:8px;

    transition:.2s;

}

.password-toggle:hover{

    color:var(--green);

    background:var(--green-light);

}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-btn{

    width:100%;

    height:54px;

    border:none;

    border-radius:13px;

    margin-top:5px;

    background:
        linear-gradient(
            135deg,
            var(--green),
            var(--green-dark)
        );

    color:#ffffff;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(15,107,79,.24);

    transition:.25s;

}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 25px rgba(15,107,79,.30);

}

.login-btn:active{
    transform:translateY(0);
}

.login-btn:disabled{

    opacity:.75;

    cursor:not-allowed;

}


/* =========================================================
   LOADER
========================================================= */

.loader{

    width:17px;
    height:17px;

    border:3px solid rgba(255,255,255,.35);

    border-top:3px solid #ffffff;

    border-radius:50%;

    display:inline-block;

    animation:spin .8s linear infinite;

    vertical-align:middle;

    margin-right:7px;

}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

.forgot-password{

    text-align:center;

    margin-top:17px;

}

.forgot-password a{

    color:var(--green);

    font-size:13px;

    font-weight:600;

    text-decoration:none;

}

.forgot-password a:hover{

    text-decoration:underline;

}


/* =========================================================
   DIVIDER
========================================================= */

.divider{

    display:flex;

    align-items:center;

    gap:10px;

    margin:21px 0;

    color:#a0aaa5;

    font-size:10px;

    font-weight:600;

}

.divider::before,
.divider::after{

    content:"";

    height:1px;

    background:#e5ebe8;

    flex:1;

}


/* =========================================================
   SIGN UP
========================================================= */

.signup{

    text-align:center;

    font-size:13px;

    color:var(--muted);

}

.signup a{

    color:var(--green);

    font-weight:700;

    text-decoration:none;

    margin-left:3px;

}

.signup a:hover{

    text-decoration:underline;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

    body{
        padding:15px;
    }

    .login-box{

        padding:28px 20px;

        border-radius:21px;

    }

    .logo{

        width:72px;
        height:72px;

        border-radius:17px;

    }

    .brand-name{
        font-size:19px;
    }

    .login-box h2{
        font-size:22px;
    }

    .login-box > p{
        font-size:12px;
        margin-bottom:20px;
    }

    .input-group input{
        height:51px;
    }

    .login-btn{
        height:51px;
    }

}

</style>

</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        <img
        src="1234.png"
        alt="Evergreen Investments">

    </div>


    <!-- BRAND -->

    <div class="brand-name">
        Evergreen Investments
    </div>

    <div class="brand-subtitle">
        Smart investment. Steady growth.
    </div>


    <!-- WELCOME -->

    <h2>
        Welcome Back
    </h2>

    <p>
        Login to your Evergreen Investments account.
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <div class="input-group">

            <i class="fa-solid fa-envelope input-icon"></i>

            <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email"
            required>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <i class="fa-solid fa-lock input-icon"></i>

            <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required>


            <button
            type="button"
            class="password-toggle"
            id="togglePassword"
            aria-label="Show password">

                <i class="fa-solid fa-eye"></i>

            </button>

        </div>


        <!-- LOGIN -->

        <button
        type="submit"
        id="loginBtn"
        class="login-btn">

            Login

        </button>


        <!-- FORGOT -->

        <div class="forgot-password">

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </div>


        <!-- DIVIDER -->

        <div class="divider">

            <span>ACCOUNT</span>

        </div>


        <!-- REGISTER -->

        <div class="signup">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


    </form>


</div>


<script src="popup.js"></script>

<script src="login.js"></script>


<script>

/* =========================================================
   PASSWORD SHOW / HIDE
========================================================= */

const password =
document.getElementById("password");

const toggle =
document.getElementById("togglePassword");


toggle.addEventListener("click", function(){

    const icon =
    toggle.querySelector("i");


    if(password.type === "password"){

        password.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

        toggle.setAttribute(
            "aria-label",
            "Hide password"
        );

    }else{

        password.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

        toggle.setAttribute(
            "aria-label",
            "Show password"
        );

    }

});

</script>


</body>

         </html>
