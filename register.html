<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | Crest Wealth Investment</title><link rel="stylesheet" href="popup.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

html,
body{
width:100%;
min-height:100%;
}

body{
min-height:100vh;
background:
radial-gradient(circle at 10% 10%,rgba(59,130,246,.25),transparent 30%),
radial-gradient(circle at 90% 90%,rgba(30,64,175,.30),transparent 30%),
linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

/* REGISTER CARD */

.register-box{
width:100%;
max-width:420px;
background:#fff;
border-radius:22px;
padding:28px;
box-shadow:0 20px 60px rgba(0,0,0,.40);
}

/* LOGO */

.logo{
width:72px;
height:72px;
margin:0 auto 12px;
display:flex;
align-items:center;
justify-content:center;
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
}

/* HEADER */

.register-box h2{
text-align:center;
font-size:23px;
font-weight:700;
color:#123c91;
margin-bottom:5px;
}

.register-box > p{
text-align:center;
font-size:13px;
color:#64748b;
margin-bottom:20px;
}

/* INPUT */

.input-group{
position:relative;
margin-bottom:11px;
}

.input-group input{
width:100%;
height:50px;
border:1px solid #dbe3ef;
border-radius:11px;
background:#f8fafc;
outline:none;
font-size:13px;
padding:0 45px;
color:#0f172a;
transition:.25s;
}

.input-group input:focus{
background:#fff;
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.input-icon{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
color:#64748b;
font-size:14px;
}

/* PASSWORD TOGGLE */

.password-toggle{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
border:none;
background:transparent;
color:#64748b;
cursor:pointer;
padding:7px;
font-size:15px;
}

.password-toggle:hover{
color:#2563eb;
}

/* REGISTER BUTTON */

.register-btn{
width:100%;
height:51px;
border:none;
border-radius:11px;
margin-top:5px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
font-size:15px;
font-weight:600;
cursor:pointer;
box-shadow:0 7px 18px rgba(37,99,235,.25);
transition:.25s;
}

.register-btn:hover{
transform:translateY(-1px);
}

.register-btn:disabled{
opacity:.75;
cursor:not-allowed;
}

/* LOADER */

.loader{
width:17px;
height:17px;
border:3px solid rgba(255,255,255,.35);
border-top:3px solid #fff;
border-radius:50%;
display:inline-block;
animation:spin .8s linear infinite;
vertical-align:middle;
margin-right:7px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* LOGIN */

.login{
text-align:center;
font-size:13px;
color:#64748b;
margin-top:17px;
}

.login a{
color:#2563eb;
font-weight:600;
text-decoration:none;
margin-left:3px;
}

.login a:hover{
text-decoration:underline;
}

/* MOBILE */

@media(max-width:480px){

body{
padding:12px;
align-items:center;
}

.register-box{
padding:24px 19px;
border-radius:19px;
}

.logo{
width:65px;
height:65px;
}

.register-box h2{
font-size:21px;
}

.register-box > p{
font-size:12px;
margin-bottom:17px;
}

.input-group{
margin-bottom:9px;
}

.input-group input{
height:48px;
}

.register-btn{
height:49px;
}

}

</style></head><body><div class="register-box"><div class="logo"><img
src="1234.png"
alt="Crest Wealth Investment">

</div><h2>Create Account</h2><p>Join Crest Wealth Investment today.</p><form id="registerForm"><div class="input-group"><i class="fa-solid fa-user input-icon"></i>

<input
type="text"
id="fullName"
placeholder="Full Name"
autocomplete="name"
required>

</div><div class="input-group"><i class="fa-solid fa-envelope input-icon"></i>

<input
type="email"
id="email"
placeholder="Email Address"
autocomplete="email"
required>

</div><div class="input-group"><i class="fa-solid fa-phone input-icon"></i>

<input
type="tel"
id="phone"
placeholder="Phone Number"
autocomplete="tel"
required>

</div><div class="input-group"><i class="fa-solid fa-gift input-icon"></i>

<input
type="text"
id="referralCode"
placeholder="Referral Code (Optional)"
autocomplete="off">

</div><div class="input-group"><i class="fa-solid fa-lock input-icon"></i>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="new-password"
required>

<button
type="button"
class="password-toggle"
id="togglePassword"
aria-label="Show password">

<i class="fa-solid fa-eye"></i>

</button></div><div class="input-group"><i class="fa-solid fa-shield-halved input-icon"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
autocomplete="new-password"
required>

<button
type="button"
class="password-toggle"
id="toggleConfirmPassword"
aria-label="Show password">

<i class="fa-solid fa-eye"></i>

</button></div><button
type="submit"
id="registerBtn"
class="register-btn">

Create Account

</button><div class="login">Already have an account?

<a href="login.html">
Login
</a></div></form></div><script src="popup.js"></script><script src="register.js"></script><script>

/* PASSWORD SHOW/HIDE */

function setupPasswordToggle(inputId,toggleId){

const input =
document.getElementById(inputId);

const toggle =
document.getElementById(toggleId);

toggle.addEventListener("click",function(){

const icon =
toggle.querySelector("i");

if(input.type === "password"){

input.type = "text";

icon.classList.remove("fa-eye");

icon.classList.add("fa-eye-slash");

}else{

input.type = "password";

icon.classList.remove("fa-eye-slash");

icon.classList.add("fa-eye");

}

});

}

setupPasswordToggle(
"password",
"togglePassword"
);

setupPasswordToggle(
"confirmPassword",
"toggleConfirmPassword"
);

</script></body>
   </html>
