<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#083d2e"
>

<title>
    Transactions | Evergreen Investments
</title>


<!-- =====================================================
     GOOGLE FONTS
===================================================== -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
>


<!-- =====================================================
     FONT AWESOME
===================================================== -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --evergreen:#147a58;

    --evergreen-dark:#083d2e;

    --green:#20a873;

    --light-green:#e8f7f0;

    --background:#f4f8f6;

    --white:#ffffff;

    --text:#12251e;

    --muted:#718079;

    --border:#e1ebe6;

    --red:#e74c3c;

    --orange:#f59e0b;

    --blue:#3b82f6;

    --purple:#7c3aed;

}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* =====================================================
   BODY
===================================================== */

body{

    font-family:
        "DM Sans",
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    min-height:100vh;

    padding-bottom:80px;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    background:
        linear-gradient(
            135deg,
            #062f24,
            #083d2e 50%,
            #147a58
        );

    color:white;

    padding:
        17px 16px 25px;

}


.header-top{

    max-width:700px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:13px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button{

    width:40px;

    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    background:
        rgba(255,255,255,.12);

    color:white;

    text-decoration:none;

}


.back-button i{

    font-size:15px;

}


/* =====================================================
   LOGO
===================================================== */

.evergreen-logo{

    width:39px;

    height:39px;

    position:relative;

    flex-shrink:0;

}


.logo-leaf{

    position:absolute;

    width:17px;

    height:24px;

    background:#20a873;

    border-radius:
        100% 0 100% 0;

}


.logo-leaf.one{

    left:3px;

    top:1px;

    transform:
        rotate(-35deg);

}


.logo-leaf.two{

    right:2px;

    top:1px;

    transform:
        rotate(35deg)
        scaleX(-1);

}


.logo-leaf.three{

    left:10px;

    top:10px;

    background:#75d6ad;

    transform:
        rotate(-5deg);

}


.logo-trunk{

    position:absolute;

    width:5px;

    height:20px;

    left:17px;

    bottom:0;

    background:#d8b58a;

    border-radius:4px;

}


/* =====================================================
   HEADER TEXT
===================================================== */

.header-text h1{

    font-family:
        "Manrope",
        sans-serif;

    font-size:19px;

    font-weight:800;

}


.header-text p{

    font-size:11px;

    color:
        rgba(255,255,255,.68);

    margin-top:3px;

}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:100%;

    max-width:700px;

    margin:auto;

    padding:
        0 15px 30px;

}


/* =====================================================
   SUMMARY CARD
===================================================== */

.summary-card{

    background:white;

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:19px;

    margin-top:-8px;

    box-shadow:
        0 10px 30px
        rgba(8,61,46,.07);

}


.summary-top{

    display:flex;

    align-items:center;

    gap:12px;

}


.summary-icon{

    width:45px;

    height:45px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        var(--light-green);

    color:
        var(--evergreen);

}


.summary-icon i{

    font-size:18px;

}


.summary-text h2{

    font-family:
        "Manrope",
        sans-serif;

    font-size:15px;

    font-weight:800;

}


.summary-text p{

    color:
        var(--muted);

    font-size:11px;

    margin-top:3px;

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:
        22px 2px 11px;

}


.section-title h3{

    font-family:
        "Manrope",
        sans-serif;

    font-size:14px;

    font-weight:800;

}


.section-title span{

    font-size:11px;

    color:
        var(--muted);

}


/* =====================================================
   TRANSACTIONS
===================================================== */

#transactions{

    display:flex;

    flex-direction:column;

    gap:11px;

}


/* =====================================================
   TRANSACTION CARD
===================================================== */

.transaction{

    position:relative;

    background:white;

    border:
        1px solid var(--border);

    border-radius:17px;

    padding:15px;

    box-shadow:
        0 5px 18px
        rgba(8,61,46,.035);

    overflow:hidden;

}


/* =====================================================
   TRANSACTION TOP
===================================================== */

.top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

}


/* =====================================================
   TYPE
===================================================== */

.type{

    font-family:
        "Manrope",
        sans-serif;

    font-size:14px;

    font-weight:800;

    color:
        var(--text);

}


/* =====================================================
   AMOUNT
===================================================== */

.amount{

    font-family:
        "Manrope",
        sans-serif;

    font-size:15px;

    font-weight:800;

    color:
        var(--evergreen);

}


/* =====================================================
   STATUS ROW
===================================================== */

.status{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    margin-top:9px;

    padding:
        5px 10px;

    border-radius:30px;

    font-size:10px;

    font-weight:700;

    color:white;

}


/* =====================================================
   STATUS COLORS
===================================================== */

.Pending{

    background:
        var(--orange);

}


.Approved{

    background:
        var(--green);

}


.Rejected{

    background:
        var(--red);

}


.Active{

    background:
        var(--blue);

}


.Completed{

    background:
        #6b7280;

}


.Credited{

    background:
        var(--green);

}


/* =====================================================
   DATE
===================================================== */

.date{

    display:flex;

    align-items:center;

    gap:6px;

    margin-top:9px;

    font-size:11px;

    color:
        var(--muted);

}


.date i{

    font-size:10px;

    color:
        #91a49b;

}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state{

    background:white;

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:
        45px 20px;

    text-align:center;

}


.empty-state i{

    width:58px;

    height:58px;

    border-radius:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:
        0 auto 15px;

    background:
        var(--light-green);

    color:
        var(--evergreen);

    font-size:22px;

}


.empty-state h3{

    font-family:
        "Manrope",
        sans-serif;

    font-size:15px;

    margin-bottom:6px;

}


.empty-state p{

    font-size:12px;

    color:
        var(--muted);

    line-height:1.6;

}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottom-nav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    height:68px;

    background:white;

    border-top:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:
        space-around;

    z-index:1000;

    box-shadow:
        0 -5px 20px
        rgba(8,61,46,.06);

}


.bottom-nav a{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    text-decoration:none;

    color:#8b9993;

    font-size:10px;

    font-weight:600;

}


.bottom-nav a i{

    font-size:17px;

}


.bottom-nav a.active{

    color:
        var(--evergreen);

}


.bottom-nav a.active i{

    transform:
        translateY(-1px);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:420px){

    .container{

        padding-left:12px;

        padding-right:12px;

    }


    .summary-card{

        padding:16px;

    }


    .transaction{

        padding:14px;

    }


    .type{

        font-size:13px;

    }


    .amount{

        font-size:14px;

    }

}

</style>

</head>


<body>

     HEADER
===================================================== -->

<header class="header">

    <div class="header-top">


        <a
            href="dashboard.html"

        >

            <i class="fa-solid fa-arrow-left"></i>

        </a>


        <div class="evergreen-logo">

            <div class="logo-leaf one"></div>

            <div class="logo-leaf two"></div>

            <div class="logo-leaf three"></div>

            <div class="logo-trunk"></div>

        </div>


        <div class="header-text">

            <h1>
                Transactions
            </h1>

            <p>
                Evergreen Investments
            </p>

        </div>


    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- =================================================
         SUMMARY
    ================================================== -->

    <div class="summary-card">

        <div class="summary-top">


            <div class="summary-icon">

                <i class="fa-solid fa-arrow-right-arrow-left"></i>

            </div>


            <div class="summary-text">

                <h2>
                    Account Activity
                </h2>

                <p>
                    Deposits, withdrawals, investments
                    and earnings
                </p>

            </div>


        </div>

    </div>



    <!-- =================================================

    ================================================== -->

    <div class="section-title">

        <h3>

        </span>

    </div>



    <!-- =================================================
         TRANSACTIONS
    ================================================== -->

    <div id="transactions">

    </div>


</main>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">


    <a href="home.html">

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </html>
