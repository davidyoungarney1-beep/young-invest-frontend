<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#073b2a"
>

<title>
    Transactions | Evergreen Investments
</title>


<!-- GOOGLE FONTS -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
>


<!-- FONT AWESOME -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --forest:#073b2a;
    --evergreen:#0f6b4d;
    --green:#15966a;

    --background:#f6f8f7;
    --white:#ffffff;

    --text:#10251d;
    --muted:#7b8983;

    --border:#e4ebe7;

    --orange:#f59e0b;
    --red:#df5145;
    --blue:#3978d6;

}


/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

body{

    font-family:
        "DM Sans",
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    min-height:100vh;

    padding-bottom:85px;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    background:
        var(--forest);

    color:white;

    padding:
        18px 16px 30px;

}


.header-inner{

    max-width:720px;

    margin:auto;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.back-button{

    width:38px;

    height:38px;

    border:
        1px solid
        rgba(255,255,255,.16);

    background:
        rgba(255,255,255,.07);

    color:white;

    border-radius:10px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

}


.back-button i{

    font-size:14px;

}


/* =====================================================
   HEADER LABEL
===================================================== */

.header-label{

    font-size:9px;

    letter-spacing:2.5px;

    font-weight:700;

    color:
        rgba(255,255,255,.48);

}


.header-title{

    margin-top:24px;

}


.header-title h1{

    font-family:
        "Manrope",
        sans-serif;

    font-size:27px;

    font-weight:800;

    letter-spacing:-.7px;

}


.header-title p{

    margin-top:5px;

    font-size:11px;

    color:
        rgba(255,255,255,.58);

}


/* =====================================================
   HEADER LINE
===================================================== */

.header-line{

    width:42px;

    height:3px;

    background:
        var(--green);

    margin-top:18px;

    border-radius:3px;

}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:100%;

    max-width:720px;

    margin:auto;

    padding:
        0 15px 35px;

}


/* =====================================================
   ACTIVITY INTRO
===================================================== */

.activity-intro{

    background:white;

    margin-top:-10px;

    padding:18px 17px;

    border:
        1px solid var(--border);

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    box-shadow:
        0 8px 25px
        rgba(7,59,42,.05);

}


.intro-left{

    display:flex;

    align-items:center;

    gap:12px;

}


/* Different from the old rounded icon */

.intro-mark{

    width:34px;

    height:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-left:
        3px solid var(--green);

    color:
        var(--evergreen);

}


.intro-mark i{

    font-size:15px;

}


.intro-text h2{

    font-family:
        "Manrope",
        sans-serif;

    font-size:13px;

    font-weight:800;

}


.intro-text p{

    margin-top:3px;

    color:var(--muted);

    font-size:10px;

}


.intro-status{

    font-size:8px;

    font-weight:700;

    color:
        var(--green);

    letter-spacing:.5px;

    white-space:nowrap;

}


/* =====================================================
   SECTION HEADER
===================================================== */

.section-head{

    margin:
        25px 2px 13px;

    display:flex;

    align-items:end;

    justify-content:space-between;

}


.section-head h3{

    font-family:
        "Manrope",
        sans-serif;

    font-size:15px;

    font-weight:800;

}


.section-head span{

    color:
        var(--muted);

    font-size:9px;

}


/* =====================================================
   TRANSACTION LIST
===================================================== */

#transactions{

    display:flex;

    flex-direction:column;

    gap:8px;

}


/* =====================================================
   TRANSACTION CARD
===================================================== */

.transaction{

    position:relative;

    background:white;

    border:
        1px solid var(--border);

    border-radius:12px;

    padding:
        15px 14px 14px 17px;

    box-shadow:
        0 4px 14px
        rgba(7,59,42,.025);

    overflow:hidden;

    transition:
        transform .2s ease,
        box-shadow .2s ease;

}


/* left transaction indicator */

.transaction::before{

    content:"";

    position:absolute;

    left:0;

    top:0;

    bottom:0;

    width:3px;

    background:
        #dfe8e3;

}


/* =====================================================
   TRANSACTION TOP
===================================================== */

.top{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:15px;

}


/* =====================================================
   TRANSACTION TYPE
===================================================== */

.type{

    font-family:
        "Manrope",
        sans-serif;

    font-size:13px;

    font-weight:800;

    color:
        var(--text);

    line-height:1.35;

}


/* =====================================================
   AMOUNT
===================================================== */

.amount{

    font-family:
        "Manrope",
        sans-serif;

    font-size:14px;

    font-weight:800;

    color:
        var(--evergreen);

    white-space:nowrap;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    display:inline-flex;

    align-items:center;

    margin-top:8px;

    padding:
        4px 8px;

    border-radius:5px;

    font-size:8px;

    font-weight:700;

    color:white;

    letter-spacing:.2px;

}


/* STATUS COLORS */

.Pending{
    background:var(--orange);
}

.Approved{
    background:var(--green);
}

.Rejected{
    background:var(--red);
}

.Active{
    background:var(--blue);
}

.Completed{
    background:#69736f;
}

.Credited{
    background:var(--green);
}


/* =====================================================
   DATE
===================================================== */

.date{

    display:flex;

    align-items:center;

    gap:6px;

    margin-top:10px;

    padding-top:9px;

    border-top:
        1px solid #edf1ef;

    color:
        var(--muted);

    font-size:9px;

}


.date i{

    font-size:9px;

    color:
        #9ba8a2;

}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state{

    background:white;

    border:
        1px solid var(--border);

    border-radius:14px;

    padding:
        52px 22px;

    text-align:center;

}


.empty-symbol{

    width:44px;

    height:44px;

    margin:
        0 auto 17px;

    border:
        1px solid #dbe6e0;

    display:flex;

    align-items:center;

    justify-content:center;

    color:
        var(--evergreen);

    background:
        #f5faf7;

}


.empty-symbol i{

    font-size:17px;

}


.empty-state h3{

    font-family:
        "Manrope",
        sans-serif;

    font-size:14px;

    margin-bottom:6px;

}


.empty-state p{

    max-width:260px;

    margin:auto;

    font-size:10px;

    line-height:1.6;

    color:
        var(--muted);

}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    height:68px;

    background:white;

    border-top:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-around;

    z-index:1000;

    box-shadow:
        0 -5px 20px
        rgba(7,59,42,.06);

}


.bottom-nav a{

    position:relative;

    min-width:58px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    text-decoration:none;

    color:#929d98;

    font-size:9px;

    font-weight:600;

}


.bottom-nav a i{

    font-size:15px;

}


.bottom-nav a.active{

    color:
        var(--evergreen);

}


/* active line instead of rounded icon */

.bottom-nav a.active::before{

    content:"";

    position:absolute;

    top:0;

    width:18px;

    height:2px;

    background:
        var(--evergreen);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:420px){

    .container{

        padding-left:12px;

        padding-right:12px;

    }


    .header{

        padding-left:14px;

        padding-right:14px;

    }


    .header-title h1{

        font-size:24px;

    }


    .activity-intro{

        padding:16px 14px;

    }


    .intro-status{

        display:none;

    }


    .transaction{

        padding:
            14px 12px 13px 15px;

    }


    .type{

        font-size:12px;

    }


    .amount{

        font-size:13px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-inner">


        <div class="topbar">


            <a
                href="dashboard.html"
                class="back-button"
            >

                <i class="fa-solid fa-arrow-left"></i>

            </a>


            <span class="header-label">
                EVERGREEN ACCOUNT
            </span>


        </div>


        <div class="header-title">

            <h1>
                Transactions
            </h1>

            <p>
                A complete record of your account activity
            </p>

            <div class="header-line"></div>

        </div>


    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- ACTIVITY INTRO -->

    <section class="activity-intro">


        <div class="intro-left">


            <div class="intro-mark">

                <i class="fa-solid fa-list-check"></i>

            </div>

                <h2>
                    Account Activity
                </h2>

                <p>
                    Your latest financial movements
                </p>

            </div>


        </div>


        <span class="intro-status">
            LIVE RECORD
        </span>


    </section>



    <!-- SECTION -->

    <div class="section-head">

        <h3>
            Recent Activity
        </h3>

        <span>
            Transaction history
        </span>

    </div>



    <!-- TRANSACTIONS -->

    <div id="transactions">

</main>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">


    <a href="home.html">

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>


    <a href="investment.html">

        <i class="fa-solid fa-box-open"></i>

        <span>
            Products
        </span>

        <i class="fa-solid fa-users"></i>

        <span>
            Team
        </span>

    </a>

        href="dashboard.html"

        <i class="fa-solid fa-user"></i>

        <span>
            Mine
        </span>

    </a>


</nav>



<!-- EXISTING TRANSACTION SCRIPT -->

<script src="transaction.js"></script>


</body>

</html>
