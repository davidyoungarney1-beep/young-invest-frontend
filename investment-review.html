<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#083d2e"
>

<title>
    My Investments | Evergreen Investments
</title>


<!-- GOOGLE FONTS -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
>


<!-- FONT AWESOME -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --evergreen:#147a58;
    --evergreen-dark:#083d2e;

    --green:#20a873;
    --mint:#e8f7f0;

    --background:#f4f8f6;

    --white:#ffffff;

    --text:#12251e;

    --muted:#718079;

    --border:#e1ebe6;

    --orange:#f59e0b;

    --blue:#3b82f6;

    --red:#ef4444;

}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* =====================================================
   BODY
===================================================== */

body{

    font-family:
        "DM Sans",
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

    min-height:100vh;

    padding-bottom:85px;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    background:
        linear-gradient(
            135deg,
            #062f24,
            #083d2e 50%,
            #147a58
        );

    color:white;

    padding:
        17px 16px 25px;

}


.header-inner{

    max-width:700px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:13px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button{

    width:40px;

    height:40px;

    border-radius:12px;

    background:
        rgba(255,255,255,.12);

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    flex-shrink:0;

}


.back-button i{

    font-size:15px;

}


/* =====================================================
   EVERGREEN LOGO
===================================================== */

.evergreen-logo{

    width:40px;

    height:40px;

    position:relative;

    flex-shrink:0;

}


.logo-leaf{

    position:absolute;

    width:18px;

    height:25px;

    background:#20a873;

    border-radius:
        100% 0 100% 0;

}


.logo-leaf.one{

    left:3px;

    top:1px;

    transform:
        rotate(-35deg);

}


.logo-leaf.two{

    right:2px;

    top:1px;

    transform:
        rotate(35deg)
        scaleX(-1);

}


.logo-leaf.three{

    left:11px;

    top:11px;

    background:#75d6ad;

    transform:
        rotate(-5deg);

}


.logo-trunk{

    position:absolute;

    width:5px;

    height:20px;

    left:18px;

    bottom:0;

    background:#d8b58a;

    border-radius:4px;

}


/* =====================================================
   HEADER TEXT
===================================================== */

.header-text h1{

    font-family:
        "Manrope",
        sans-serif;

    font-size:19px;

    font-weight:800;

}


.header-text p{

    margin-top:3px;

    font-size:11px;

    color:
        rgba(255,255,255,.70);

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:100%;

    max-width:700px;

    margin:auto;

    padding:
        20px 15px 30px;

}


/* =====================================================
   INTRO CARD
===================================================== */

.intro-card{

    background:white;

    border:
        1px solid var(--border);

    border-radius:19px;

    padding:18px;

    margin-bottom:20px;

    box-shadow:
        0 8px 25px
        rgba(8,61,46,.05);

}


.intro-top{

    display:flex;

    align-items:center;

    gap:12px;

}


.intro-icon{

    width:46px;

    height:46px;

    border-radius:14px;

    background:
        var(--mint);

    color:
        var(--evergreen);

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

}


.intro-icon i{

    font-size:19px;

}


.intro-text h2{

    font-family:
        "Manrope",
        sans-serif;

    font-size:15px;

    font-weight:800;

}


.intro-text p{

    color:
        var(--muted);

    font-size:11px;

    line-height:1.5;

    margin-top:3px;

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-heading{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:
        0 2px 11px;

}


.section-heading h3{

    font-family:
        "Manrope",
        sans-serif;

    font-size:14px;

    font-weight:800;

}


.section-heading span{

    font-size:10px;

    color:
        var(--muted);

}


/* =====================================================
   INVESTMENT CONTAINER
===================================================== */

#investmentContainer{

    display:flex;

    flex-direction:column;

    gap:13px;

}


/* =====================================================
   INVESTMENT CARD
===================================================== */

.card{

    background:white;

    border:
        1px solid var(--border);

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 6px 20px
        rgba(8,61,46,.045);

}


/* =====================================================
   CARD HEADER
===================================================== */

.card-header{

    padding:16px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    border-bottom:
        1px solid var(--border);

}


.plan-info{

    display:flex;

    align-items:center;

    gap:11px;

    min-width:0;

}


.plan-icon{

    width:43px;

    height:43px;

    border-radius:13px;

    background:
        var(--mint);

    color:
        var(--evergreen);

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

}


.plan-icon i{

    font-size:17px;

}


.plan-info h2{

    font-family:
        "Manrope",
        sans-serif;

    font-size:14px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.plan-info p{

    margin-top:3px;

    color:
        var(--muted);

    font-size:10px;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    padding:
        5px 10px;

    border-radius:30px;

    font-size:10px;

    font-weight:700;

    white-space:nowrap;

}


.status.running{

    background:#e8f7f0;

    color:
        var(--evergreen);

    border:
        1px solid #bce6d3;

}


.status.completed{

    background:#edf4ff;

    color:
        var(--blue);

    border:
        1px solid #c8dcfa;

}


/* =====================================================
   CARD CONTENT
===================================================== */

.card-content{

    padding:16px;

}


/* =====================================================
   MAIN INVESTMENT VALUE
===================================================== */

.main-stat{

    background:
        linear-gradient(
            135deg,
            #f1faf6,
            #f8fcfa
        );

    border:
        1px solid #dfeee7;

    border-radius:14px;

    padding:15px;

    margin-bottom:14px;

}


.main-stat p{

    font-size:10px;

    color:
        var(--muted);

    margin-bottom:4px;

}


.main-stat h3{

    font-family:
        "Manrope",
        sans-serif;

    font-size:23px;

    font-weight:800;

    color:
        var(--evergreen);

}


/* =====================================================
   DETAILS GRID
===================================================== */

.details-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    border:
        1px solid var(--border);

    border-radius:13px;

    overflow:hidden;

}


.detail{

    padding:13px;

    border-right:
        1px solid var(--border);

    border-bottom:
        1px solid var(--border);

}


.detail:nth-child(2n){

    border-right:none;

}


.detail:nth-last-child(-n+2){

    border-bottom:none;

}


.detail-label{

    display:block;

    color:
        var(--muted);

    font-size:9px;

    margin-bottom:5px;

}


.detail-value{

    font-family:
        "Manrope",
        sans-serif;

    font-size:12px;

    font-weight:700;

    color:
        var(--text);

    word-break:break-word;

}


/* =====================================================
   PROGRESS
===================================================== */

.progress-section{

    margin-top:16px;

}


.progress-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:7px;

}


.progress-top span{

    color:
        var(--muted);

    font-size:10px;

}


.progress-top strong{

    color:
        var(--evergreen);

    font-size:10px;

}


.progress-bar{

    width:100%;

    height:7px;

    background:#e8efeb;

    border-radius:20px;

    overflow:hidden;

}


.progress-fill{

    height:100%;

    background:
        linear-gradient(
            90deg,
            #147a58,
            #20a873
        );

    border-radius:20px;

    transition:
        width .5s ease;

}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty{

    background:white;

    border:
        1px solid var(--border);

    border-radius:19px;

    padding:
        45px 20px;

    text-align:center;

    box-shadow:
        0 7px 20px
        rgba(8,61,46,.04);

}


.empty-icon{

    width:60px;

    height:60px;

    margin:
        0 auto 14px;

    border-radius:18px;

    background:
        var(--mint);

    color:
        var(--evergreen);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:23px;

}


.empty h3{

    font-family:
        "Manrope",
        sans-serif;

    font-size:15px;

}


.empty p{

    margin-top:6px;

    color:
        var(--muted);

    font-size:11px;

}


/* =====================================================
   ERROR
===================================================== */

.error{

    background:white;

    border:
        1px solid #fecaca;

    border-left:
        4px solid var(--red);

    border-radius:14px;

    padding:20px;

    text-align:center;

}


.error h3{

    color:
        var(--red);

    font-size:14px;

}


.error p{

    margin-top:5px;

    color:
        var(--muted);

    font-size:11px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn{

    width:100%;

    margin-top:20px;

    padding:13px;

    border:none;

    border-radius:13px;

    background:
        var(--evergreen-dark);

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    font-family:
        "DM Sans",
        sans-serif;

    font-size:12px;

    font-weight:700;

    cursor:pointer;

}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    height:68px;

    background:white;

    border-top:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:
        space-around;

    z-index:1000;

    box-shadow:
        0 -5px 20px
        rgba(8,61,46,.06);

}


.bottom-nav a{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:4px;

    text-decoration:none;

    color:#8b9993;

    font-size:10px;

    font-weight:600;

}


.bottom-nav a i{

    font-size:17px;

}


.bottom-nav a.active{

    color:
        var(--evergreen);

}


/* =====================================================
   FOOTER
===================================================== */

footer{

    text-align:center;

    padding:
        10px 15px 25px;

    color:#91a09a;

    font-size:9px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:420px){

    .container{

        padding-left:12px;

        padding-right:12px;

    }


    .card-header{

        padding:14px;

    }


    .card-content{

        padding:14px;

    }


    .plan-info h2{

        font-size:13px;

    }


    .status{

        font-size:9px;

        padding:
            5px 8px;

    }


    .main-stat h3{

        font-size:21px;

    }


    .detail{

        padding:11px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-inner">


        <a
            href="dashboard.html"
            class="back-button"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </a>


        <div class="evergreen-logo">

            <div class="logo-leaf one"></div>

            <div class="logo-leaf two"></div>

            <div class="logo-leaf three"></div>

            <div class="logo-trunk"></div>

        </div>


        <div class="header-text">

            <h1>
                My Investments
            </h1>

            <p>
                Monitor your active investment plans
            </p>

        </div>


    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- =================================================
         INTRO
    ================================================== -->

    <div class="intro-card">

        <div class="intro-top">


            <div class="intro-icon">

                <i class="fa-solid fa-chart-line"></i>

            </div>


            <div class="intro-text">

                <h2>
                    Investment Portfolio
                </h2>

                <p>
                    Track your investment amount,
                    earnings, progress and completion dates.
                </p>

            </div>


        </div>

    </div>



    <!-- =================================================
         SECTION
    ================================================== -->

    <div class="section-heading">

        <h3>
            Your Investments
        </h3>

        <span>
            Active plans
        </span>

    </div>



    <!-- =================================================
         INVESTMENTS
    ================================================== -->

    <div id="investmentContainer">

        <!-- Investments load here -->

    </div>



    <!-- =================================================
         BACK
    ================================================== -->

    <button
        class="back-btn"
        onclick="window.location.href='dashboard.html'"
    >

        <i class="fa-solid fa-arrow-left"></i>

        Back to Mine

    </button>


</main>



<footer>

    © 2026 Evergreen Investments. All Rights Reserved.

</footer>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">


    <a href="home.html">

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>


    <a
        href="investment.html"
        class="active"
    >

        <i class="fa-solid fa-box-open"></i>

        <span>
            Products
        </span>

    </a>


    <a href="invite.html">

        <i class="fa-solid fa-users"></i>

        <span>
            Team
        </span>

    </a>


    <a href="dashboard.html">

        <i class="fa-solid fa-user"></i>

        <span>
            Mine
        </span>

    </a>


</nav>



<script>

/* =====================================================
   USER
===================================================== */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if(!user){

    window.location.href =
        "login.html";

}


/* =====================================================
   LOAD INVESTMENTS
===================================================== */

async function loadInvestments(){

    const container =
        document.getElementById(
            "investmentContainer"
        );


    try{

        const response =
            await fetch(
                `https://young-invest-backend.onrender.com/api/investment/${user._id}`
            );


        if(!response.ok){

            throw new Error(
                "Failed to load investments"
            );

        }


        const investments =
            await response.json();


        container.innerHTML = "";


        /* =================================================
           NO INVESTMENTS
        ================================================== */

        if(!investments.length){

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">

                        <i class="fa-solid fa-chart-line"></i>

                    </div>


                    <h3>
                        No Active Investment Yet
                    </h3>


                    <p>
                        Start an investment plan to see it here.
                    </p>

                </div>

            `;

            return;

        }


        /* =================================================
           DISPLAY INVESTMENTS
        ================================================== */

        investments.forEach(item => {


            const now =
                new Date();


            const endDate =
                new Date(
                    item.endDate
                );


            const startDate =
                new Date(
                    item.startDate
                );


            let status =
                "Running";


            let statusClass =
                "running";


            if(endDate < now){

                status =
                    "Completed";

                statusClass =
                    "completed";

            }


            /* =================================================
               PROGRESS
            ================================================= */

            const duration =
                Number(
                    item.duration
                ) || 1;


            const daysPaid =
                Number(
                    item.daysPaid
                ) || 0;


            let progress =
                (daysPaid / duration) * 100;


            progress =
                Math.min(
                    100,
                    Math.max(
                        0,
                        progress
                    )
                );


            container.innerHTML += `

                <div class="card">


                    <div class="card-header">


                        <div class="plan-info">


                            <div class="plan-icon">

                                                              <i class="fa-solid fa-chart-line"></i>

                            </div>


                            <div>

                                <h2>
                                    ${
                                        item.planName ||
                                        "Investment Plan"
                                    }
                                </h2>

                                <p>
                                    Investment Account
                                </p>

                            </div>


                        </div>


                        <span class="status ${statusClass}">
                            ${status}
                        </span>


                    </div>


                    <div class="card-content">


                        <div class="main-stat">

                            <p>
                                Investment Amount
                            </p>

                            <h3>
                                ₦${Number(
                                    item.amount || 0
                                ).toLocaleString()}
                            </h3>

                        </div>


                        <div class="details-grid">


                            <div class="detail">

                                <span class="detail-label">
                                    Daily Profit
                                </span>

                                <span class="detail-value">
                                    ₦${Number(
                                        item.dailyProfit || 0
                                    ).toLocaleString()}
                                </span>

                            </div>


                            <div class="detail">

                                <span class="detail-label">
                                    Total Return
                                </span>

                                <span class="detail-value">
                                    ₦${Number(
                                        item.totalReturn || 0
                                    ).toLocaleString()}
                                </span>

                            </div>


                            <div class="detail">

                                <span class="detail-label">
                                    Days Paid
                                </span>

                                <span class="detail-value">
                                    ${daysPaid} / ${duration}
                                </span>

                            </div>


                            <div class="detail">

                                <span class="detail-label">
                                    Duration
                                </span>

                                <span class="detail-value">
                                    ${duration} Days
                                </span>

                            </div>


                            <div class="detail">

                                <span class="detail-label">
                                    Start Date
                                </span>

                                <span class="detail-value">
                                    ${startDate.toLocaleDateString()}
                                </span>

                            </div>


                            <div class="detail">

                                <span class="detail-label">
                                    End Date
                                </span>

                                <span class="detail-value">
                                    ${endDate.toLocaleDateString()}
                                </span>

                            </div>


                        </div>


                        <div class="progress-section">


                            <div class="progress-top">

                                <span>
                                    Investment Progress
                                </span>

                                <strong>
                                    ${Math.round(progress)}%
                                </strong>

                            </div>


                            <div class="progress-bar">

                                <div
                                    class="progress-fill"
                                    style="width:${progress}%"
                                ></div>

                            </div>


                        </div>


                    </div>


                </div>

            `;

        });


    }

    catch(error){

        console.error(
            "Investment Error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <h3>
                    Unable to Load Investments
                </h3>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   START
===================================================== */

loadInvestments();

</script>


</body>

</html>
