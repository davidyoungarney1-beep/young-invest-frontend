<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Active Investments | Crest Wealth Investment</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

/* =========================================================
   CREST WEALTH
   ACTIVE INVESTMENT — PROFESSIONAL UI
========================================================= */

:root{
    --primary:#0d6efd;
    --primary-dark:#0b5ed7;
    --navy:#0b1220;
    --text:#172033;
    --muted:#64748b;
    --light:#f5f7fa;
    --white:#ffffff;
    --border:#e5eaf0;
    --green:#16a34a;
    --red:#dc2626;

    --shadow:0 8px 25px rgba(15,23,42,.06);
    --shadow-lg:0 15px 40px rgba(15,23,42,.09);
}

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:var(--light);
    color:var(--text);
    min-height:100vh;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    height:75px;
    background:var(--navy);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand img{
    width:38px;
    height:38px;
    object-fit:contain;
    border-radius:7px;
}

.brand h2{
    font-size:18px;
    font-weight:700;
}

.header-link{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:7px;
    color:#dbe7f7;
    font-size:12px;
    transition:.2s ease;
}

.header-link:hover{
    background:rgba(255,255,255,.06);
    color:#fff;
}

/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:35px 20px 70px;
}

/* =========================================================
   PAGE TITLE
========================================================= */

.page-heading{
    margin-bottom:28px;
}

.page-heading h1{
    font-size:25px;
    font-weight:700;
    letter-spacing:-.5px;
    color:var(--text);
}

.page-heading p{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
}

/* =========================================================
   INVESTMENT CARD
========================================================= */

.card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:.2s ease;
}

.card:hover{
    box-shadow:var(--shadow-lg);
    transform:translateY(-2px);
}

/* =========================================================
   CARD HEADER
========================================================= */

.card-header{
    padding:20px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    background:#fff;
    border-bottom:1px solid var(--border);
}

.plan-info{
    display:flex;
    align-items:center;
    gap:13px;
}

.plan-icon{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    background:#edf5ff;
    color:var(--primary);
    font-size:18px;
}

.plan-info h2{
    font-size:16px;
    font-weight:700;
    color:var(--text);
}

.plan-info p{
    margin-top:2px;
    font-size:11px;
    color:var(--muted);
}

/* =========================================================
   STATUS
========================================================= */

.status{
    padding:6px 11px;
    border-radius:6px;
    font-size:10px;
    font-weight:600;
    white-space:nowrap;
}

.status.running{
    background:#ecfdf3;
    color:var(--green);
    border:1px solid #bbf7d0;
}

.status.completed{
    background:#eff6ff;
    color:var(--primary);
    border:1px solid #bfdbfe;
}

/* =========================================================
   CARD CONTENT
========================================================= */

.card-content{
    padding:20px 22px;
}

/* =========================================================
   MAIN STAT
========================================================= */

.main-stat{
    padding:18px;
    background:#f8fafc;
    border:1px solid #edf1f5;
    border-radius:8px;
    margin-bottom:18px;
}

.main-stat p{
    color:var(--muted);
    font-size:11px;
    margin-bottom:4px;
}

.main-stat h3{
    font-size:25px;
    color:var(--primary);
    font-weight:700;
}

/* =========================================================
   DETAILS GRID
========================================================= */

.details-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
}

.detail{
    padding:15px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
}

.detail:nth-child(3n){
    border-right:none;
}

.detail:nth-last-child(-n+3){
    border-bottom:none;
}

.detail-label{
    display:block;
    font-size:10px;
    color:var(--muted);
    margin-bottom:5px;
}

.detail-value{
    font-size:13px;
    font-weight:600;
    color:var(--text);
    word-break:break-word;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-section{
    margin-top:20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
}

.progress-top span{
    font-size:11px;
    color:var(--muted);
}

.progress-top strong{
    font-size:11px;
    color:var(--text);
}

.progress-bar{
    width:100%;
    height:7px;
    background:#e9eef4;
    border-radius:10px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    background:var(--primary);
    border-radius:10px;
    transition:width .5s ease;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:55px 20px;
    text-align:center;
    box-shadow:var(--shadow);
}

.empty-icon{
    width:60px;
    height:60px;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#edf5ff;
    color:var(--primary);
    border-radius:50%;
    font-size:24px;
}

.empty h3{
    font-size:16px;
    color:var(--text);
}

.empty p{
    margin-top:6px;
    color:var(--muted);
    font-size:12px;
}

/* =========================================================
   ERROR
========================================================= */

.error{
    background:#fff;
    border:1px solid #fecaca;
    border-left:4px solid var(--red);
    border-radius:8px;
    padding:20px;
    text-align:center;
}

.error h3{
    color:var(--red);
    font-size:14px;
}

.error p{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn{
    width:100%;
    max-width:300px;
    margin:25px auto 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 18px;
    border:none;
    border-radius:7px;
    background:var(--navy);
    color:#fff;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:.2s ease;
}

.back-btn:hover{
    background:#162238;
    transform:translateY(-1px);
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
    font-size:10px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .header{
        height:68px;
        padding:0 15px;
    }

    .brand h2{
        font-size:16px;
    }

    .brand img{
        width:34px;
        height:34px;
    }

    .header-link span{
        display:none;
    }

    .header-link{
        width:38px;
        height:38px;
        padding:0;
        justify-content:center;
    }

    .container{
        padding:25px 14px 55px;
    }

    .page-heading h1{
        font-size:21px;
    }

    .page-heading p{
        font-size:11px;
    }

    .card-header{
        padding:16px;
    }

    .card-content{
        padding:16px;
    }

    .plan-info h2{
        font-size:14px;
    }

    .details-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .detail{
        border-right:1px solid var(--border);
        border-bottom:1px solid var(--border);
    }

    .detail:nth-child(3n){
        border-right:1px solid var(--border);
    }

    .detail:nth-child(2n){
        border-right:none;
    }

    .detail:nth-last-child(-n+3){
        border-bottom:1px solid var(--border);
    }

    .detail:last-child,
    .detail:nth-last-child(2){
        border-bottom:none;
    }

    .main-stat h3{
        font-size:21px;
    }

}

/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:400px){

    .status{
        padding:5px 8px;
        font-size:9px;
    }

    .plan-icon{
        width:38px;
        height:38px;
        font-size:15px;
    }

    .plan-info h2{
        font-size:13px;
    }

    .detail{
        padding:12px;
    }

    .detail-value{
        font-size:12px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

<div class="brand">

<img src="1234.png" alt="Crest Wealth Logo">

<h2>Crest Wealth</h2>

</div>

<a href="dashboard.html" class="header-link">

<i class="fas fa-arrow-left"></i>

<span>Dashboard</span>

</a>

</header>


<!-- MAIN -->

<main class="container">

<div class="page-heading">

<h1>Active Investments</h1>

<p>Monitor your current investment plans and returns.</p>

</div>


<div id="investmentContainer">

<!-- Investments load here -->

</div>


<button
class="back-btn"
onclick="window.location.href='dashboard.html'">

<i class="fas fa-arrow-left"></i>

Back to Dashboard

</button>

</main>


<footer>

© 2026 Crest Wealth Investment. All Rights Reserved.

</footer>


<script>

/* =========================================================
   USER
========================================================= */

const user = JSON.parse(localStorage.getItem("user"));

if (!user) {

    window.location.href = "login.html";

}


/* =========================================================
   LOAD INVESTMENTS
========================================================= */

async function loadInvestments(){

    const container =
        document.getElementById("investmentContainer");

    try{

        const response = await fetch(
            `https://young-invest-backend.onrender.com/api/investment/${user._id}`
        );

        if(!response.ok){

            throw new Error("Failed to load investments");

        }

        const investments = await response.json();

        container.innerHTML = "";


        /* =================================================
           NO INVESTMENT
        ================================================= */

        if(!investments.length){

            container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    <i class="fas fa-chart-line"></i>

                </div>

                <h3>No Active Investment Yet</h3>

                <p>
                    Start an investment plan to see it here.
                </p>

            </div>

            `;

            return;

        }


        /* =================================================
           DISPLAY INVESTMENTS
        ================================================= */

        investments.forEach(item => {

            const now = new Date();

            const endDate = new Date(item.endDate);

            const startDate = new Date(item.startDate);

            let status = "Running";

            let statusClass = "running";


            if(endDate < now){

                status = "Completed";

                statusClass = "completed";

            }


            /* PROGRESS */

            const duration =
                Number(item.duration) || 1;

            const daysPaid =
                Number(item.daysPaid) || 0;

            let progress =
                (daysPaid / duration) * 100;

            progress =
                Math.min(100, Math.max(0, progress));


            container.innerHTML += `

            <div class="card">

                <div class="card-header">

                    <div class="plan-info">

                        <div class="plan-icon">

                            <i class="fas fa-chart-line"></i>

                        </div>

                        <div>

                            <h2>
                                ${item.planName || "Investment Plan"}
                            </h2>

                            <p>
                                Investment Account
                            </p>

                        </div>

                    </div>


                    <span class="status ${statusClass}">

                        ${status}

                    </span>

                </div>


                <div class="card-content">


                    <div class="main-stat">

                        <p>
                            Investment Amount
                        </p>

                        <h3>
                            ₦${Number(item.amount || 0).toLocaleString()}
                        </h3>

                    </div>


                    <div class="details-grid">


                        <div class="detail">

                            <span class="detail-label">
                                Daily Profit
                            </span>

                            <span class="detail-value">
                                ₦${Number(item.dailyProfit || 0).toLocaleString()}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Total Return
                            </span>

                            <span class="detail-value">
                                ₦${Number(item.totalReturn || 0).toLocaleString()}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Days Paid
                            </span>

                            <span class="detail-value">
                                ${daysPaid} / ${duration}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Duration
                            </span>

                            <span class="detail-value">
                                ${duration} Days
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Start Date
                            </span>

                            <span class="detail-value">
                                ${startDate.toLocaleDateString()}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                End Date
                            </span>

                            <span class="detail-value">
                                ${endDate.toLocaleDateString()}
                            </span>

                        </div>


                    </div>


                    <div class="progress-section">

                        <div class="progress-top">

                            <span>
                                Investment Progress
                            </span>

                            <strong>
                                ${Math.round(progress)}%
                            </strong>

                        </div>


                        <div class="progress-bar">

                            <div
                                class="progress-fill"
                                style="width:${progress}%">
                            </div>

                        </div>

                    </div>


                </div>

            </div>

            `;

        });


    }catch(error){

        console.log(error);

        container.innerHTML = `

        <div class="error">

            <h3>
                Unable to Load Investments
            </h3>

            <p>
                Please refresh the page and try again.
            </p>

        </div>

        `;

    }

}


/* =========================================================
   START
========================================================= */

loadInvestments();

</script>

</body>

    </html>
