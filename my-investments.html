<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0b3d2e"
>

<title>My Investments | Evergreen Investments</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --dark:#092f25;
    --evergreen:#137957;
    --green:#20a873;

    --background:#f5f8f6;

    --white:#ffffff;

    --text:#10231d;

    --muted:#718078;

    --border:#e2ebe6;

    --soft:#edf8f3;

    --gold:#c79b45;

    --red:#e05252;

}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    font-family:"DM Sans",sans-serif;

    background:var(--background);

    color:var(--text);

    min-height:100vh;

    padding-bottom:90px;

}


/* =====================================================
   TOP AREA
===================================================== */

.top-area{

    background:
        linear-gradient(
            145deg,
            #061f18,
            #092f25 55%,
            #0e5b42
        );

    padding:
        18px 16px 34px;

    color:white;

}


.top-inner{

    max-width:700px;

    margin:auto;

}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar{

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.back-link{

    width:40px;

    height:40px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    background:
        rgba(255,255,255,.10);

    text-decoration:none;

}


.mine-label{

    display:flex;

    align-items:center;

    gap:8px;

    font-size:11px;

    font-weight:700;

    letter-spacing:.4px;

    color:
        rgba(255,255,255,.75);

}


.mine-label i{

    font-size:13px;

}


/* =====================================================
   PAGE TITLE
===================================================== */

.page-title{

    margin-top:27px;

}


.page-title small{

    font-size:10px;

    color:
        rgba(255,255,255,.58);

}


.page-title h1{

    margin-top:5px;

    font-family:"Manrope",sans-serif;

    font-size:26px;

    font-weight:800;

}


.page-title p{

    margin-top:5px;

    max-width:430px;

    font-size:11px;

    line-height:1.5;

    color:
        rgba(255,255,255,.67);

}


/* =====================================================
   PORTFOLIO SUMMARY
===================================================== */

.portfolio-summary{

    max-width:700px;

    margin:
        -20px auto 0;

    padding:
        0 15px;

    position:relative;

    z-index:5;

}


.summary-card{

    background:white;

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:17px;

    box-shadow:
        0 12px 30px
        rgba(8,61,46,.08);

}


.summary-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}


.summary-title{

    display:flex;

    align-items:center;

    gap:10px;

}


.summary-icon{

    width:42px;

    height:42px;

    border-radius:13px;

    background:var(--soft);

    color:var(--evergreen);

    display:flex;

    align-items:center;

    justify-content:center;

}


.summary-title h2{

    font-family:"Manrope",sans-serif;

    font-size:14px;

    font-weight:800;

}


.summary-title p{

    margin-top:2px;

    font-size:9px;

    color:var(--muted);

}


.mine-badge{

    padding:
        6px 10px;

    border-radius:30px;

    background:#f5f1e8;

    color:#94702f;

    border:
        1px solid #eadfc8;

    font-size:9px;

    font-weight:700;

}


.summary-line{

    height:1px;

    background:var(--border);

    margin:15px 0;

}


.summary-note{

    display:flex;

    align-items:center;

    gap:8px;

    color:var(--muted);

    font-size:10px;

}


.summary-note i{

    color:var(--green);

}


/* =====================================================
   MAIN
===================================================== */

.main{

    width:100%;

    max-width:700px;

    margin:auto;

    padding:
        22px 15px 30px;

}


/* =====================================================
   SECTION HEADER
===================================================== */

.section-header{

    display:flex;

    align-items:end;

    justify-content:space-between;

    margin-bottom:12px;

}


.section-header h2{

    font-family:"Manrope",sans-serif;

    font-size:15px;

    font-weight:800;

}


.section-header span{

    color:var(--muted);

    font-size:9px;

}


/* =====================================================
   INVESTMENT LIST
===================================================== */

#investmentContainer{

    display:flex;

    flex-direction:column;

    gap:14px;

}


/* =====================================================
   INVESTMENT ITEM
===================================================== */

.investment-item{

    background:white;

    border:
        1px solid var(--border);

    border-radius:19px;

    overflow:hidden;

    box-shadow:
        0 6px 20px
        rgba(8,61,46,.04);

}


/* =====================================================
   ITEM TOP
===================================================== */

.item-top{

    padding:15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}


.plan-left{

    display:flex;

    align-items:center;

    gap:11px;

    min-width:0;

}


.plan-symbol{

    width:43px;

    height:43px;

    flex-shrink:0;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #e5f6ee,
            #f4fbf8
        );

    color:var(--evergreen);

    display:flex;

    align-items:center;

    justify-content:center;

}


.plan-symbol i{

    font-size:16px;

}


.plan-name{

    min-width:0;

}


.plan-name h3{

    font-family:"Manrope",sans-serif;

    font-size:13px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.plan-name p{

    margin-top:3px;

    color:var(--muted);

    font-size:9px;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    flex-shrink:0;

    padding:
        5px 9px;

    border-radius:30px;

    font-size:9px;

    font-weight:700;

}


.status.running{

    background:#e7f7ef;

    color:#137957;

}


.status.completed{

    background:#edf2f0;

    color:#65736d;

}


/* =====================================================
   AMOUNT PANEL
===================================================== */

.amount-panel{

    margin:
        0 15px;

    padding:
        14px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #f0faf5,
            #f8fcfa
        );

    border:
        1px solid #deeee7;

}


.amount-label{

    color:var(--muted);

    font-size:9px;

}


.amount{

    margin-top:3px;

    font-family:"Manrope",sans-serif;

    color:var(--evergreen);

    font-size:23px;

    font-weight:800;

}


/* =====================================================
   DETAILS
===================================================== */

.details{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    margin:
        15px;

    border:
        1px solid var(--border);

    border-radius:14px;

    overflow:hidden;

}


.detail{

    padding:
        11px 9px;

    border-right:
        1px solid var(--border);

}


.detail:last-child{

    border-right:none;

}


.detail-label{

    display:block;

    color:var(--muted);

    font-size:8px;

    margin-bottom:4px;

}


.detail-value{

    font-family:"Manrope",sans-serif;

    font-size:11px;

    font-weight:700;

    word-break:break-word;

}


/* =====================================================
   PROGRESS
===================================================== */

.progress-area{

    padding:
        0 15px 16px;

}


.progress-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:6px;

}


.progress-head span{

    color:var(--muted);

    font-size:9px;

}


.progress-head strong{

    color:var(--evergreen);

    font-size:9px;

}


.progress-track{

    width:100%;

    height:6px;

    background:#e8efeb;

    border-radius:20px;

    overflow:hidden;

}


.progress-bar{

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #137957,
            #20a873
        );

}


/* =====================================================
   EMPTY
===================================================== */

.empty-state{

    background:white;

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:
        50px 20px;

    text-align:center;

}


.empty-icon{

    width:62px;

    height:62px;

    margin:
        0 auto 15px;

    border-radius:19px;

    background:var(--soft);

    color:var(--evergreen);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

}


.empty-state h3{

    font-family:"Manrope",sans-serif;

    font-size:15px;

}


.empty-state p{

    margin-top:6px;

    color:var(--muted);

    font-size:10px;

    line-height:1.5;

}


/* =====================================================
   ERROR
===================================================== */

.error-state{

    background:white;

    border:
        1px solid #f1d2d2;

    border-radius:18px;

    padding:30px 20px;

    text-align:center;

}


.error-state i{

    color:var(--red);

    font-size:22px;

}


.error-state h3{

    margin-top:10px;

    font-size:14px;

}


.error-state p{

    margin-top:5px;

    color:var(--muted);

    font-size:10px;

}


/* =====================================================
   MINE BUTTON
===================================================== */

.mine-button{

    width:100%;

    margin-top:20px;

    padding:13px;

    border:none;

    border-radius:14px;

    background:var(--dark);

    color:white;

    font-family:"DM Sans",sans-serif;

    font-size:11px;

    font-weight:700;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    cursor:pointer;

}


/* =====================================================
   FOOTER
===================================================== */

footer{

    text-align:center;

    padding:
        5px 15px 25px;

    color:#91a09a;

    font-size:9px;

}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    height:70px;

    background:white;

    border-top:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-around;

    box-shadow:
        0 -5px 20px
        rgba(8,61,46,.07);

    z-index:1000;

}


.bottom-nav a{

    position:relative;

    min-width:55px;

    text-decoration:none;

    color:#89958f;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:4px;

    font-size:9px;

    font-weight:600;

}


.bottom-nav a i{

    font-size:17px;

}


.bottom-nav a.active{

    color:var(--evergreen);

}


.bottom-nav a.active::before{

    content:"";

    position:absolute;

    top:-14px;

    width:28px;

    height:3px;

    border-radius:10px;

    background:var(--green);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

    .main{

        padding-left:12px;

        padding-right:12px;

    }


    .portfolio-summary{

        padding-left:12px;

        padding-right:12px;

    }


    .page-title h1{

        font-size:24px;

    }


    .details{

        grid-template-columns:
            repeat(3,1fr);

    }


    .detail{

        padding:
            10px 7px;

    }


    .detail-value{

        font-size:10px;

    }


    .amount{

        font-size:21px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TOP
===================================================== -->

<header class="top-area">

    <div class="top-inner">


        <div class="top-bar">

            <a
                href="dashboard.html"
                class="back-link"
            >

                <i class="fa-solid fa-arrow-left"></i>

            </a>


            <div class="mine-label">

                <i class="fa-solid fa-user"></i>

                MINE

            </div>

        </div>


        <div class="page-title">

            <small>
                ACCOUNT PORTFOLIO
            </small>

            <h1>
                My Investments
            </h1>

            <p>
                View and monitor the investment plans
                connected to your account.
            </p>

        </div>


    </div>

</header>



<!-- =====================================================
     SUMMARY
===================================================== -->

<section class="portfolio-summary">

    <div class="summary-card">


        <div class="summary-top">


            <div class="summary-title">

                <div class="summary-icon">

                    <i class="fa-solid fa-chart-pie"></i>

                </div>


                <div>

                    <h2>
                        My Portfolio
                    </h2>

                    <p>
                        Your personal investments
                    </p>

                </div>

            </div>


            <div class="mine-badge">

                Mine

            </div>


        </div>


        <div class="summary-line"></div>


        <div class="summary-note">

            <i class="fa-solid fa-shield-halved"></i>

            Your investment information is connected
            to your account.

        </div>


    </div>

</section>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <div class="section-header">

        <h2>
            Investment Plans
        </h2>

        <span>
            My account
        </span>

    </div>


    <div id="investmentContainer"></div>


    <button
        class="mine-button"
        onclick="window.location.href='dashboard.html'"
    >

        <i class="fa-solid fa-user"></i>

        Return to Mine

    </button>


</main>



<footer>

    © 2026 Evergreen Investments

</footer>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">


    <a href="home.html">

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>


    <a href="investment.html">

        <i class="fa-solid fa-box-open"></i>

        <span>
            Product
        </span>

    </a>


    <a href="invite.html">

        <i class="fa-solid fa-users"></i>

        <span>
            Team
        </span>

    </a>


    <!-- MINE IS ACTIVE -->

    <a
        href="dashboard.html"
        class="active"
    >

        <i class="fa-solid fa-user"></i>

        <span>
            Mine
        </span>

    </a>


</nav>



<script>

/* =====================================================
   USER
===================================================== */

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if(!user){

    window.location.href =
        "login.html";

}


/* =====================================================
   LOAD INVESTMENTS
===================================================== */

async function loadInvestments(){

    const container =
        document.getElementById(
            "investmentContainer"
        );


    try{

        const response =
            await fetch(
                `https://young-invest-backend.onrender.com/api/investment/${user._id}`
            );


        if(!response.ok){

            throw new Error(
                "Failed to load investments"
            );

        }


        const investments =
            await response.json();


        container.innerHTML = "";


        /* =================================================
           EMPTY
        ================================================== */

        if(!investments.length){

            container.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">

                        <i class="fa-solid fa-chart-line"></i>

                    </div>

                    <h3>
                        No Investments Yet
                    </h3>

                    <p>
                        Your investment plans will appear
                        here after you start one.
                    </p>

                </div>

            `;

            return;

        }


        /* =================================================
           DISPLAY
        ================================================== */

        investments.forEach(item => {


            const now =
                new Date();


            const endDate =
                new Date(
                    item.endDate
                );


            const startDate =
                new Date(
                    item.startDate
                );


            let status =
                "Running";


            let statusClass =
                "running";


            if(endDate < now){

                status =
                    "Completed";

                statusClass =
                    "completed";

            }


            const duration =
                Number(
                    item.duration
                ) || 1;


            const daysPaid =
                Number(
                    item.daysPaid
                ) || 0;


            let progress =
                (daysPaid / duration) * 100;


            progress =
                Math.min(
                    100,
                    Math.max(
                        0,
                        progress
                    )
                );


            container.innerHTML += `

                <article class="investment-item">


                    <div class="item-top">


                        <div class="plan-left">


                            <div class="plan-symbol">

                                <i class="fa-solid fa-chart-line"></i>

                            </div>


                            <div class="plan-name">

                                <h3>
                                    ${
                                        item.planName ||
                                        "Investment Plan"
                                    }
                                </h3>

                                <p>
                                    Evergreen Investment
                                </p>

                            </div>


                        </div>


                        <span
                            class="status ${statusClass}"
                        >
                            ${status}
                        </span>


                    </div>


                    <div class="amount-panel">

                        <div class="amount-label">
                            Investment Amount
                        </div>

                        <div class="amount">

                            ₦${Number(
                                item.amount || 0
                            ).toLocaleString()}

                        </div>

                    </div>


                    <div class="details">


                        <div class="detail">

                            <span class="detail-label">
                                Daily Profit
                            </span>

                            <span class="detail-value">

                                ₦${Number(
                                    item.dailyProfit || 0
                                ).toLocaleString()}

                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Return
                            </span>

                            <span class="detail-value">

                                ₦${Number(
                                    item.totalReturn || 0
                                ).toLocaleString()}

                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Duration
                            </span>

                            <span class="detail-value">

                                ${duration} Days

                            </span>

                        </div>


                    </div>


                    <div class="details">


                        <div class="detail">

                            <span class="detail-label">
                                Days Paid
                            </span>

                            <span class="detail-value">

                                ${daysPaid}/${duration}

                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Started
                            </span>

                            <span class="detail-value">

                                ${startDate.toLocaleDateString()}

                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Ends
                            </span>

                            <span class="detail-value">

                                ${endDate.toLocaleDateString()}

                            </span>

                        </div>


                    </div>


                    <div class="progress-area">


                        <div class="progress-head">

                            <span>
                                Plan Progress
                            </span>

                            <strong>
                                ${Math.round(progress)}%
                            </strong>

                        </div>


                        <div class="progress-track">

                            <div
                                class="progress-bar"
                                style="width:${progress}%"
                            ></div>

                        </div>


                    </div>


                </article>

            `;

        });


    }

    catch(error){

        console.error(
            "Investment Error:",
            error
        );


        container.innerHTML = `

            <div class="error-state">

                <i class="fa-solid fa-circle-exclamation"></i>

                <h3>
                    Unable to Load Investments
                </h3>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>

        `;

    }

}


loadInvestments();

</script>


</body>

</html>
