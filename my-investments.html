<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Investments | Evergreen Investments</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --forest:#073b2a;
    --green:#137957;
    --bright:#20a873;
    --bg:#f5f8f6;
    --white:#ffffff;
    --text:#10251d;
    --muted:#74827c;
    --border:#e1e9e5;
}

body{
    font-family:"DM Sans",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:90px;
}

/* =========================
   HEADER
========================= */

.top{
    background:var(--forest);
    color:white;
    padding:32px 22px 34px;
}

.top-inner{
    max-width:650px;
    margin:auto;
}

.eyebrow{
    font-size:11px;
    letter-spacing:2px;
    font-weight:700;
    opacity:.65;
    margin-bottom:10px;
}

.top h1{
    font-family:"Manrope",sans-serif;
    font-size:31px;
    line-height:1.1;
    font-weight:800;
}

/* =========================
   CONTENT
========================= */

.container{
    width:92%;
    max-width:650px;
    margin:25px auto;
}

/* =========================
   PORTFOLIO SUMMARY
========================= */

.summary{
    background:white;
    border:1px solid var(--border);
    padding:20px;
    margin-bottom:20px;
}

.summary-label{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-bottom:8px;
}

.summary-title{
    font-family:"Manrope",sans-serif;
    font-size:21px;
    font-weight:800;
    margin-bottom:4px;
}

.summary-text{
    font-size:13px;
    color:var(--muted);
}

/* =========================
   SECTION TITLE
========================= */

.section-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:26px 0 12px;
}

.section-heading h2{
    font-family:"Manrope",sans-serif;
    font-size:17px;
    font-weight:800;
}

.section-heading span{
    font-size:12px;
    color:var(--muted);
}

/* =========================
   INVESTMENT ITEM
========================= */

.investment{
    background:white;
    border:1px solid var(--border);
    margin-bottom:14px;
    padding:20px;
}

.item-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:15px;
    padding-bottom:17px;
    border-bottom:1px solid var(--border);
}

.plan-wrap{
    display:flex;
    align-items:flex-start;
    gap:12px;
}

.plan-marker{
    width:4px;
    min-height:45px;
    background:var(--bright);
    margin-top:2px;
}

.plan-name{
    font-family:"Manrope",sans-serif;
    font-size:17px;
    font-weight:800;
    line-height:1.2;
}

.plan-date{
    font-size:12px;
    color:var(--muted);
    margin-top:5px;
}

.status{
    font-size:10px;
    letter-spacing:1px;
    font-weight:800;
    color:var(--green);
    white-space:nowrap;
}

/* =========================
   MONEY SECTION
========================= */

.money{
    display:grid;
    grid-template-columns:1fr 1fr;
    border-bottom:1px solid var(--border);
}

.money-box{
    padding:18px 0;
}

.money-box + .money-box{
    border-left:1px solid var(--border);
    padding-left:18px;
}

.money-label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    margin-bottom:6px;
}

.money-value{
    font-family:"Manrope",sans-serif;
    font-size:18px;
    font-weight:800;
}

.return-value{
    color:var(--green);
}

/* =========================
   DETAILS
========================= */

.details{
    margin-top:4px;
}

.detail{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 0;
    border-bottom:1px solid #edf1ef;
}

.detail:last-child{
    border-bottom:none;
}

.detail span:first-child{
    font-size:12px;
    color:var(--muted);
}

.detail span:last-child{
    font-size:12px;
    font-weight:700;
    text-align:right;
}

/* =========================
   EMPTY / ERROR
========================= */

.message{
    background:white;
    border:1px solid var(--border);
    padding:35px 20px;
    text-align:center;
}

.message-icon{
    width:45px;
    height:45px;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    color:var(--green);
}

.message h3{
    font-family:"Manrope",sans-serif;
    font-size:17px;
    margin-bottom:7px;
}

.message p{
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}

/* =========================
   BUTTON
========================= */

.return-btn{
    width:100%;
    border:none;
    background:var(--forest);
    color:white;
    padding:16px;
    margin-top:20px;
    font-family:"DM Sans",sans-serif;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.return-btn:active{
    transform:scale(.99);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:white;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:center;
    z-index:1000;
}

.nav-inner{
    width:100%;
    max-width:650px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.nav-item{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#89958f;
    font-size:10px;
    font-weight:600;
    gap:6px;
}

.nav-item i{
    font-size:17px;
}

.nav-item.active{
    color:var(--forest);
}

.nav-item.active::before{
    content:"";
    position:absolute;
    top:0;
    left:25%;
    right:25%;
    height:2px;
    background:var(--bright);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:420px){

    .top{
        padding:28px 18px 30px;
    }

    .top h1{
        font-size:28px;
    }

    .container{
        width:94%;
    }

    .investment{
        padding:17px;
    }

    .money-value{
        font-size:16px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="top">

    <div class="top-inner">

        <div class="eyebrow">
            ACCOUNT PORTFOLIO
        </div>

        <h1>
            My Investments
        </h1>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <section class="summary">

        <div class="summary-label">
            Portfolio
        </div>

        <div class="summary-title">
            Active Investments
        </div>

        <div class="summary-text">
            Your current investment records are listed below.
        </div>

    </section>


    <div class="section-heading">

        <h2>
            Investment Records
        </h2>

        <span id="investmentCount">
            0 plans
        </span>

    </div>


    <div id="investmentList">

        <div class="message">

            <div class="message-icon">
                <i class="fa-solid fa-spinner fa-spin"></i>
            </div>

            <h3>
                Loading investments
            </h3>

            <p>
                Please wait while your investment records are retrieved.
            </p>

        </div>

    </div>


    <button
        class="return-btn"
        onclick="location.href='dashboard.html'"
    >
        Return to Dashboard
    </button>


</main>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

    <div class="nav-inner">

        <a
            href="home.html"
            class="nav-item"
        >
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>


        <a
            href="investment.html"
            class="nav-item"
        >
            <i class="fa-solid fa-chart-line"></i>
            <span>Product</span>
        </a>


        <a
            href="invite.html"
            class="nav-item"
        >
            <i class="fa-solid fa-users"></i>
            <span>Team</span>
        </a>


        <a
            href="dashboard.html"
            class="nav-item active"
        >
            <i class="fa-solid fa-user"></i>
            <span>Mine</span>
        </a>

    </div>

</nav>


<script>

const API =
"https://young-invest-backend.onrender.com/api/investment";


const list =
document.getElementById("investmentList");

const count =
document.getElementById("investmentCount");


/* =========================
   FORMAT MONEY
========================= */

function money(value){

    const amount =
        Number(value) || 0;

    return "₦" + amount.toLocaleString(
        "en-NG",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

    if(!date){
        return "—";
    }

    const d =
        new Date(date);

    if(
        Number.isNaN(
            d.getTime()
        )
    ){
        return "—";
    }

    return d.toLocaleDateString(
        "en-NG",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================
   LOAD USER
========================= */

const user =
JSON.parse(
    localStorage.getItem("user")
);


if(!user || !user._id){

    list.innerHTML = `

        <div class="message">

            <div class="message-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h3>
                Login required
            </h3>

            <p>
                Please log in to view your investment records.
            </p>

        </div>

    `;

    count.textContent =
        "0 plans";

}else{

    loadInvestments();

}


/* =========================
   LOAD INVESTMENTS
========================= */

async function loadInvestments(){

    try{

        const response =
            await fetch(
                `${API}/${user._id}`
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load investments."
            );

        }


        const investments =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(data.investments)
                        ? data.investments
                        : []
                );


        count.textContent =
            `${investments.length} ${
                investments.length === 1
                    ? "plan"
                    : "plans"
            }`;


        if(investments.length === 0){

            list.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        <i class="fa-solid fa-folder-open"></i>
                    </div>

                    <h3>
                        No investments yet
                    </h3>

                    <p>
                        Your investment records will appear here after you start a plan.
                    </p>

                </div>

            `;

            return;

        }


        list.innerHTML =
            investments.map(
                item => createInvestment(item)
            ).join("");


    }catch(error){

        console.error(error);


        count.textContent =
            "0 plans";


        list.innerHTML = `

            <div class="message">

                <div class="message-icon">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <h3>
                    Unable to load
                </h3>

                <p>
                    ${error.message || "Something went wrong while loading your investments."}
                </p>

            </div>

        `;

    }

}


/* =========================
   CREATE INVESTMENT
========================= */

function createInvestment(item){

    const amount =
        Number(item.amount) || 0;


    const dailyProfit =
        Number(item.dailyProfit) || 0;


    const totalReturn =
        Number(item.totalReturn) || 0;


    const duration =
        Number(item.duration) || 0;


    const daysPaid =
        Number(item.daysPaid) || 0;


    const status =
        String(
            item.status ||
            "RUNNING"
        ).toUpperCase();


    return `

        <article class="investment">


            <div class="item-top">


                <div class="plan-wrap">

                    <div class="plan-marker"></div>

                    <div>

                        <div class="plan-name">
                            ${item.planName || "Investment Plan"}
                        </div>

                        <div class="plan-date">
                            Started ${formatDate(item.startDate)}
                        </div>

                    </div>

                </div>


                <div class="status">
                    ${status}
                </div>


            </div>


            <div class="money">


                <div class="money-box">

                    <span class="money-label">
                        Invested
                    </span>

                    <div class="money-value">
                        ${money(amount)}
                    </div>

                </div>


                <div class="money-box">

                    <span class="money-label">
                        Total Return
                    </span>

                    <div class="money-value return-value">
                        ${money(totalReturn)}
                    </div>

                </div>


            </div>


            <div class="details">


                <div class="detail">

                    <span>
                        Daily return
                    </span>

                    <span>
                        ${money(dailyProfit)}
                    </span>

                </div>


                <div class="detail">

                    <span>
                        Duration
                    </span>

                    <span>
                        ${duration} days
                    </span>

                </div>


                <div class="detail">

                    <span>
                        Days paid
                    </span>

                    <span>
                        ${daysPaid} / ${duration}
                    </span>

                </div>


                <div class="detail">

                    <span>
                        Start date
                    </span>

                    <span>
                        ${formatDate(item.startDate)}
                    </span>

                </div>


                <div class="detail">

                    <span>
                        End date
                    </span>

                    <span>
                        ${formatDate(item.endDate)}
                    </span>

                </div>


            </div>


        </article>

    `;

}

</script>


</body>
</html>
